spring:
  application:
    name: reservas
  datasource:
    url: jdbc:postgresql://localhost:5432/reservas
    username: reservas
    password: reservas
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    # API messages must not depend on the server's language or on Accept-Language.
    locale: en
    locale-resolver: fixed